<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Vault SSO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b12;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e2ef;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #0f0f1a;
      border: 1px solid rgba(99,102,241,.25);
      border-radius: 14px;
      padding: 40px 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
    }
    .logo-text { font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub  { font-size: 13px; color: #908fa0; margin-bottom: 28px; }
    .org-pill {
      display: inline-block;
      background: rgba(99,102,241,.15);
      color: #a5b4fc;
      border: 1px solid rgba(99,102,241,.3);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    label { display: block; font-size: 12px; font-weight: 500; color: #908fa0; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    input[type=text], input[type=password] {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #e2e2ef;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 18px;
    }
    input[type=text]:focus, input[type=password]:focus {
      border-color: #6366f1;
      background: rgba(99,102,241,.08);
    }
    .error-box {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 18px;
    }
    button[type=submit] {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    button[type=submit]:hover  { background: #4f52e0; }
    button[type=submit]:active { transform: scale(.98); }
    .footer { margin-top: 22px; font-size: 12px; color: #55546a; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">V</div>
    <span class="logo-text">Vault SSO</span>
  </div>

  <div class="org-pill" th:if="${slug}" th:text="${slug}">org</div>

  <h1>Welcome back</h1>
  <p class="sub">Sign in to continue</p>

  <div class="error-box" th:if="${param.error}">
    Invalid username or password. Please try again.
  </div>

  <!-- POST to /{slug}/login so TenantResolutionFilter sets TenantContext before auth -->
  <form th:action="${slug != null ? '/' + slug + '/login' : '/login'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="username">Username or Email</label>
    <input id="username" type="text" name="username" placeholder="you@example.com" required autofocus/>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="••••••••" required/>
    <button type="submit">Sign In</button>
  </form>

  <p class="footer">Protected by Vault SSO &nbsp;·&nbsp; <a href="http://localhost:5174/signup" style="color:#6366f1;text-decoration:none;">Create account</a></p>
</div>
</body>
</html>
