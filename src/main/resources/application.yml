server:
  port: 9000
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sso_db
    username: ${DB_USER:sso_user}
    password: ${DB_PASS:sso_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  issuer-base-url: ${ISSUER_BASE_URL:http://localhost:9000}
  # Path to the persistent PKCS12 keystore for the signing key.
  # If the file does not exist it is generated on first startup and reused thereafter.
  # Absolute path so the same key is loaded regardless of working directory.
  key-store-path: ${KEY_STORE_PATH:${user.home}/.vault-sso/signing}
  key-store-password: ${KEY_STORE_PASSWORD:changeit}

platform:
  admin:
    # Gates POST/DELETE /api/brands/** — see SecurityConfig's
    # platformAdminFilterChain. Username has a harmless local-dev default;
    # password deliberately has NO default so a missing env var fails
    # startup loudly instead of quietly deploying with a guessable password.
    username: ${PLATFORM_ADMIN_USERNAME:kulshresth}
    password: ${PLATFORM_ADMIN_PASSWORD}
