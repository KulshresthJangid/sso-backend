# SSO nginx blocks — add these to /etc/nginx/conf.d/services.conf
#
# Routing map:
#   /sso/           → SSO Admin UI  (static Vite build at /root/apps/sso-frontend/)
#   /sso-server/    → SSO Admin API (Spring Boot on :9000, path prefix stripped)
#   /{tenant}/oauth2/... → OAuth2 flows directly to :9000 (no prefix strip)
#   /{tenant}/login/...  → Login page directly to :9000 (no prefix strip)

    # ===== SSO ADMIN FRONTEND (static Vite build) =====
    location = /sso {
        return 301 /sso/;
    }

    location /sso/ {
        alias /root/apps/sso-frontend/;
        index index.html;
        try_files $uri $uri/ /sso/index.html;
    }

    # ===== SSO ADMIN API =====
    location = /sso-server {
        return 301 /sso-server/;
    }

    location /sso-server/ {
        proxy_pass         http://127.0.0.1:9000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== OAUTH2 / LOGIN FLOWS (tenant-scoped paths) =====
    # Spring Authorization Server exposes:
    #   /{tenant}/oauth2/authorize
    #   /{tenant}/oauth2/token
    #   /{tenant}/oauth2/jwks
    #   /{tenant}/login
    #   /{tenant}/userinfo
    # These must be forwarded WITHOUT stripping the prefix so the backend
    # sees the full /{tenant}/... path.
    #
    # NOTE: Place this block AFTER all other specific location blocks to
    # avoid accidentally catching /lumen/, /sso/, /smat-server/, etc.
    location ~ ^/((?!lumen|sso|smat-server|sso-server|grafana|session-logger|drip|drip-api|webhook|api)[a-z0-9_-]+)/(oauth2|login|userinfo) {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OAuth2 flows can take a moment on first load
        proxy_read_timeout 30s;
    }
